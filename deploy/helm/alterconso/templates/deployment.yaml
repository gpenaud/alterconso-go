apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alterconso.fullname" . }}
  labels:
    {{- include "alterconso.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "alterconso.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "alterconso.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "alterconso.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- $initDbEnabled := and (not .Values.database.embedded.enabled) (ne .Values.database.init.adminSecret "") }}
      {{- if or .Values.waitForDatabase.enabled $initDbEnabled }}
      initContainers:
        {{- if .Values.waitForDatabase.enabled }}
        # Attend que MySQL réponde au protocole MySQL (pas juste TCP open)
        # avant de laisser démarrer l'app. mysqladmin ping renvoie exit 0
        # dès que le serveur accepte des connexions au protocole, sans
        # nécessiter d'auth (server alive = exit 0 même sur Access denied).
        - name: wait-for-db
          image: {{ .Values.waitForDatabase.image | quote }}
          env:
            - name: DB_HOST
              value: {{ include "alterconso.dbHost" . | quote }}
            - name: DB_PORT
              value: {{ include "alterconso.dbPort" . | quote }}
            - name: TIMEOUT
              value: {{ .Values.waitForDatabase.timeoutSeconds | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              elapsed=0
              until mysqladmin ping -h "$DB_HOST" -P "$DB_PORT" --connect-timeout=2 --silent 2>/dev/null; do
                if [ "$elapsed" -ge "$TIMEOUT" ]; then
                  echo "[wait-for-db] timeout: ${DB_HOST}:${DB_PORT} unreachable after ${TIMEOUT}s"
                  exit 1
                fi
                echo "[wait-for-db] waiting for ${DB_HOST}:${DB_PORT}... (${elapsed}s)"
                sleep 2
                elapsed=$((elapsed + 2))
              done
              echo "[wait-for-db] OK: ${DB_HOST}:${DB_PORT} ready"
        {{- end }}
        {{- if $initDbEnabled }}
        # Crée la DB applicative + user + grants si pas déjà fait. Requêtes
        # idempotentes (IF NOT EXISTS / ALTER USER), donc rejouées à chaque
        # restart sans effet de bord — en bonus, ALTER USER aligne le password
        # sur celui du Secret app, ce qui couvre les rotations transparentes.
        - name: init-db
          image: {{ .Values.database.init.image | quote }}
          env:
            - name: DB_HOST
              value: {{ include "alterconso.dbHost" . | quote }}
            - name: DB_PORT
              value: {{ include "alterconso.dbPort" . | quote }}
            - name: DB_NAME
              value: {{ .Values.config.db_name | quote }}
            - name: DB_USER
              value: {{ .Values.config.db_user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "alterconso.secretName" . }}
                  key: DB_PASSWORD
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.init.adminSecret }}
                  key: {{ .Values.database.init.passwordSecretKey }}
          resources:
            {{- toYaml .Values.database.init.resources | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[init-db] target ${DB_HOST}:${DB_PORT} as root"
              mysql -h "${DB_HOST}" -P "${DB_PORT}" -u "root" <<SQL
              CREATE DATABASE IF NOT EXISTS \`${DB_NAME}\`
                CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE USER IF NOT EXISTS '${DB_USER}'@'%'
                IDENTIFIED BY '${DB_PASSWORD}';
              ALTER USER '${DB_USER}'@'%'
                IDENTIFIED BY '${DB_PASSWORD}';
              GRANT ALL PRIVILEGES ON \`${DB_NAME}\`.* TO '${DB_USER}'@'%';
              FLUSH PRIVILEGES;
              SQL
              echo "[init-db] OK: ${DB_NAME} / ${DB_USER} provisioned"
        {{- end }}
      {{- end }}
      containers:
        - name: alterconso
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ include "alterconso.secretName" . }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "alterconso.fullname" . }}
