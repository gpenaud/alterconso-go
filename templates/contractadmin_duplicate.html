{{define "content"}}
{{template "cyclesStyle"}}
<div class="col-md-12 cyc">
  <form method="POST">
    <div class="cyc-panneau" style="max-width:680px;">

      <div class="cyc-entete">
        <div>
          <h3>Dupliquer « {{.Catalog.Name}} »</h3>
          <p class="cyc-chapeau">
            Crée un nouveau catalogue chez le même producteur. Les commandes
            déjà passées ne sont jamais recopiées.
          </p>
        </div>
        <a href="/contractAdmin" class="cyc-btn">
          <i class="icon icon-chevron-left"></i> Tous les catalogues
        </a>
      </div>

      <div class="cyc-section">
        <div class="cyc-champs">
          <div class="cyc-champ large">
            <label for="name">Nom du nouveau catalogue *</label>
            <input type="text" id="name" name="name" value="{{.Catalog.Name}} - copie" required />
          </div>
        </div>
      </div>

      <div class="cyc-section">
        <h4>Ce qu'on recopie</h4>
        <label class="cyc-bascule actif">
          <input type="checkbox" name="copy_products" value="1" checked />
          <span>
            <span class="titre">Les produits</span>
            <p class="cyc-note">Nom, prix, unités et photos.</p>
          </span>
        </label>
        <label class="cyc-bascule actif">
          <input type="checkbox" name="copy_distribs" value="1" checked />
          <span>
            <span class="titre">Les distributions</span>
            <p class="cyc-note">Les jours où ce producteur livre.</p>
          </span>
        </label>
      </div>

      <div class="cyc-pied">
        <a href="/contractAdmin" class="cyc-btn">Annuler</a>
        <button type="submit" class="cyc-btn cyc-btn-primaire">
          <i class="icon icon-refresh"></i> Dupliquer
        </button>
      </div>

    </div>
  </form>
</div>

<script>
document.addEventListener('change', function (e) {
  var b = e.target.closest ? e.target.closest('.cyc-bascule') : null;
  if (b && e.target.type === 'checkbox') b.classList.toggle('actif', e.target.checked);
});
</script>
{{end}}
