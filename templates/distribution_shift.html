{{define "content"}}
{{template "cyclesStyle"}}
<div class="col-md-12 cyc">
  <form method="POST">
    <div class="cyc-panneau" style="max-width:640px;">

      <div class="cyc-entete">
        <div>
          <h3>Reporter la livraison</h3>
          <p class="cyc-chapeau">
            {{.Distribution.Catalog.Name}} — seul ce producteur change de date.
            Les commandes déjà passées le suivent.
          </p>
        </div>
      </div>

      <div class="cyc-champs">
        <div class="cyc-champ">
          <label for="newDate">Nouvelle date</label>
          <input type="date" id="newDate" name="newDate" value="{{.CurrentDate}}" required />
        </div>
      </div>

      <div class="cyc-pied">
        <a href="/distribution" class="cyc-btn">Annuler</a>
        <button type="submit" class="cyc-btn cyc-btn-primaire">
          <i class="icon icon-check"></i> Reporter
        </button>
      </div>

    </div>
  </form>
</div>
{{end}}
