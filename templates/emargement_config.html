{{define "content"}}
{{template "cyclesStyle"}}
<div class="col-md-12 cyc">
  <form method="GET" action="/distribution/listByDate/{{.DateISO}}/{{.Group.ID}}/print">
    <div class="cyc-panneau" style="max-width:640px;">

      <div class="cyc-entete">
        <div>
          <h3>Liste d'émargement</h3>
          <p class="cyc-chapeau">
            Distribution du {{.DayLabel}} — la feuille qu'on imprime pour
            pointer les retraits sur place.
          </p>
        </div>
      </div>

      {{if .CatalogID}}<input type="hidden" name="catalog" value="{{.CatalogID}}" />{{end}}

      <div class="cyc-section">
        <h4>Mise en page</h4>
        <label class="cyc-bascule actif">
          <input type="radio" name="mode" value="all" checked />
          <span>
            <span class="titre">Tout à la suite</span>
            <p class="cyc-note">Une seule liste, la plus compacte.</p>
          </span>
        </label>
        <label class="cyc-bascule">
          <input type="radio" name="mode" value="perpage" />
          <span>
            <span class="titre">Une personne par page</span>
            <p class="cyc-note">Pour remettre sa feuille à chacun.</p>
          </span>
        </label>
        <label class="cyc-bascule">
          <input type="radio" name="mode" value="bycatalog" />
          <span>
            <span class="titre">Triée par catalogue</span>
            <p class="cyc-note">Pour distribuer producteur par producteur.</p>
          </span>
        </label>
        <label class="cyc-bascule">
          <input type="radio" name="mode" value="noprice" />
          <span>
            <span class="titre">Sans les prix</span>
            <p class="cyc-note">Quand la feuille circule de main en main.</p>
          </span>
        </label>
      </div>

      <div class="cyc-section">
        <h4>Taille du texte</h4>
        <div class="cyc-filtres" id="taille-police">
          <label class="cyc-filtre"><input type="radio" name="fontSize" value="S" /> Petite</label>
          <label class="cyc-filtre actif"><input type="radio" name="fontSize" value="M" checked /> Moyenne</label>
          <label class="cyc-filtre"><input type="radio" name="fontSize" value="L" /> Grande</label>
          <label class="cyc-filtre"><input type="radio" name="fontSize" value="XL" /> Très grande</label>
        </div>
      </div>

      <div class="cyc-pied">
        <a href="javascript:history.back()" class="cyc-btn">
          <i class="icon icon-chevron-left"></i> Retour
        </a>
        <span class="cyc-espace"></span>
        <button type="submit" class="cyc-btn cyc-btn-primaire">
          <i class="icon icon-print"></i> Générer la liste
        </button>
      </div>

    </div>
  </form>
</div>

<script>
// Les boutons radio se comportent comme un choix unique : celui qu'on prend
// éteint les autres, ce que la case seule ne montre pas assez.
document.addEventListener('change', function (e) {
  if (e.target.type !== 'radio') return;
  var groupe = e.target.closest('.cyc-section, .cyc-filtres');
  if (!groupe) return;
  var etiquettes = groupe.querySelectorAll('.cyc-bascule, .cyc-filtre');
  for (var i = 0; i < etiquettes.length; i++) {
    var r = etiquettes[i].querySelector('input[type=radio]');
    etiquettes[i].classList.toggle('actif', !!(r && r.checked));
  }
});
</script>
{{end}}
