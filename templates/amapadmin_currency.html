{{define "content"}}
{{template "amapadmin_nav" .}}

<form method="POST" action="/amapadmin/currency">
  <div class="cyc-section">
    <div class="cyc-champs">
      <div class="cyc-champ">
        <label for="currency">Symbole</label>
        <input type="text" id="currency" name="currency" value="{{.Group.Currency}}" placeholder="€" />
        <p class="cyc-note">Ce qui suit les montants à l'écran.</p>
      </div>
      <div class="cyc-champ">
        <label for="currencyCode">Code ISO</label>
        <input type="text" id="currencyCode" name="currencyCode" maxlength="3"
               placeholder="EUR" value="{{.Group.CurrencyCode}}" />
        <p class="cyc-note">Trois lettres, employées par les exports comptables.</p>
      </div>
    </div>
  </div>

  <div class="cyc-pied">
    <button type="submit" class="cyc-btn cyc-btn-primaire">
      <i class="icon icon-check"></i> Enregistrer
    </button>
  </div>
</form>

{{template "amapadmin_close" .}}
{{end}}
