{{define "content"}}
{{template "cyclesStyle"}}
<div class="col-md-12 cyc">
  <form method="POST">
    <div class="cyc-panneau" style="max-width:640px;">

      <div class="cyc-entete">
        <div>
          <h3>Dates de commande</h3>
          <p class="cyc-chapeau">
            {{.Distribution.Catalog.Name}} — ces dates ne valent que pour ce
            producteur. Laissées vides, il suit celles de la distribution.
          </p>
        </div>
      </div>

      <div class="cyc-champs">
        <div class="cyc-champ">
          <label for="orderStartDate">Ouverture des commandes</label>
          <input type="datetime-local" id="orderStartDate" name="orderStartDate" value="{{.OrderStartDate}}" />
        </div>
        <div class="cyc-champ">
          <label for="orderEndDate">Clôture des commandes</label>
          <input type="datetime-local" id="orderEndDate" name="orderEndDate" value="{{.OrderEndDate}}" />
        </div>
      </div>

      <div class="cyc-pied">
        <a href="/distribution" class="cyc-btn">Annuler</a>
        <button type="submit" class="cyc-btn cyc-btn-primaire">
          <i class="icon icon-check"></i> Enregistrer
        </button>
      </div>

    </div>
  </form>
</div>
{{end}}
