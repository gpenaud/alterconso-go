{{define "cyclesStyle"}}
<style>
/* Écrans des cycles de distribution.
 *
 * Garde les repères de l'application — cartes blanches, vert #5a8a00, même
 * navigation — et modernise le reste : de l'air, une hiérarchie lisible, des
 * états qui se voient d'un coup d'œil.
 *
 * Pile de polices système plutôt que Cabin : style.css l'importe de Google
 * Fonts, ce qui transmet l'adresse IP du lecteur à un tiers pour afficher du
 * texte. Ces écrans n'ajoutent rien à cette dépendance, et le rendu système
 * est plus net à petite taille — ce que demandent des tableaux denses.
 *
 * L'italique des titres est abandonné ici : à ces tailles il gêne la lecture
 * et date la page, alors que la graisse suffit à poser la hiérarchie.
 *
 * Tout est préfixé .cyc pour ne rien changer aux autres écrans, Bootstrap
 * s'appliquant globalement. */

.cyc { --vert:#5a8a00; --vert-fonce:#456a00; --vert-pale:#f2f7e8;
       --trait:#e7e3d9; --gris:#6d6a63; --gris-clair:#9a968e; --creme:#fbf9f4;
       --encre:#26251f;
       /* Brun terre : il dormait dans style.css sans presque servir. Les
          titres en noir durcissaient la page, et les mettre en vert aurait
          brouillé ce qui se clique — le vert ne dit plus que les états et les
          actions. */
       --titre:#583816; --titre-doux:#6d6a63;
       --police:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
       /* Cabin pour les titres seulement : le contraste entre les deux
          familles pose la hiérarchie, et la police du site reste présente là
          où elle se voit. Elle est servie par l'application, plus par Google. */
       --police-titre:'Cabin', var(--police); }
.cyc, .cyc input, .cyc select, .cyc textarea, .cyc button {
  font-family:var(--police); }
.cyc { color:var(--encre); -webkit-font-smoothing:antialiased; }

/* ─── En-tête d'écran ─────────────────────────────────────────────────── */
.cyc-entete { display:flex; align-items:flex-start; justify-content:space-between;
              gap:20px; flex-wrap:wrap; margin:0 0 22px; }
.cyc-entete h3 { font-family:var(--police-titre); font-style:normal;
                 margin:0 0 7px; font-size:1.75em; font-weight:700;
                 letter-spacing:-.01em; color:var(--titre); }
.cyc-chapeau { color:var(--titre-doux); margin:0; max-width:62ch; line-height:1.6; }

/* ─── Cartes ──────────────────────────────────────────────────────────── */
.cyc-carte { background:#fff; border-radius:12px; padding:26px 28px;
             box-shadow:0 1px 2px rgba(0,0,0,.05), 0 1px 12px rgba(0,0,0,.03);
             margin-bottom:18px; }

/* ─── Tableau ─────────────────────────────────────────────────────────── */
.cyc-table { width:100%; border-collapse:collapse; }
/* En-têtes de colonne discrets. Les capitales espacées d'avant criaient plus
   fort que les données qu'elles annoncent, et à cette taille elles se lisent
   lettre à lettre. Casse normale, gris moyen, un filet fin : ils nomment les
   colonnes sans se disputer la page avec elles. */
.cyc-table thead th { font-size:.82em; font-weight:600; letter-spacing:0;
                      color:#8b857a; text-align:left;
                      padding:0 14px 9px; border-bottom:1px solid var(--trait); }
.cyc-table thead th.num, .cyc-table td.num { text-align:center; }
/* Colonnes serrées : l'état et les actions ne prennent que ce qu'il leur faut,
   le reste va au nom et à l'adresse, qui en ont l'usage. */
/* En-tête qui classe : il se distingue d'un intitulé simple par sa couleur au
   survol et par la flèche qui dit le sens en cours. */
.cyc-table th a.cyc-tri { color:inherit; text-decoration:none;
                          display:inline-flex; align-items:center; gap:5px; }
.cyc-table th a.cyc-tri:hover { color:var(--titre); text-decoration:none; }
.cyc-table th a.cyc-tri.actif { color:var(--vert-fonce); font-weight:700; }
.cyc-table th a.cyc-tri i.icon { font-size:.85em; }

.cyc-table th.serre, .cyc-table td.serre { width:1%; white-space:nowrap; }
.cyc-table th.actions, .cyc-table td.actions { width:1%; white-space:nowrap;
                                               text-align:right; }
.cyc-table tbody td { padding:16px 14px; border-bottom:1px solid var(--trait);
                      vertical-align:middle; position:relative; }

/* Une cellule qui mène quelque part, cliquable sur toute sa surface. Le lien
   couvre sa cellule par un calque plutôt que par des marges négatives : les
   retraits de la première et de la dernière colonne changent d'un panneau à
   l'autre et d'un écran étroit à un large, et des valeurs recopiées ici
   auraient fini par ne plus correspondre. */
.cyc-cellule-lien { display:block; color:inherit; text-decoration:none; }
.cyc-cellule-lien::after { content:""; position:absolute; inset:0; }
.cyc-cellule-lien:hover { color:inherit; text-decoration:none; }
.cyc-cellule-lien:hover .nom { color:var(--vert-fonce); text-decoration:underline; }
.cyc-cellule-lien:focus-visible { outline:none; }
.cyc-cellule-lien:focus-visible::after { outline:2px solid var(--vert);
                                         outline-offset:-3px; border-radius:6px; }
.cyc-table tbody tr:last-child td { border-bottom:0; }
.cyc-table tbody tr { transition:background .12s ease; }
.cyc-table tbody tr:hover { background:var(--creme); }
.cyc-nom { font-family:var(--police-titre); font-weight:700; color:var(--titre);
           font-size:1.08em; display:block; text-decoration:none; }
.cyc-nom:hover { color:#3f280f; text-decoration:underline; }
.cyc-lieu { color:var(--gris); font-size:.9em; }
.cyc-chiffre { font-size:1.2em; font-weight:650; color:var(--encre);
               font-variant-numeric:tabular-nums; }
.cyc-chiffre small { display:block; font-size:.62em; font-weight:400;
                     color:var(--gris-clair); text-transform:uppercase; letter-spacing:.05em; }

/* ─── Grille de produits ─────────────────────────────────────────────────
   Le catalogue vu par un adhérent. Il tenait dans un cadre de 520 px de haut
   avec sa propre barre de défilement, en trois colonnes bootstrap : on
   consultait le catalogue par la fenêtre au lieu de le parcourir. */
.cyc-produits { display:grid; gap:12px;
                grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
.cyc-produit { display:flex; align-items:center; gap:12px; text-align:left;
               width:100%; padding:10px; border:1px solid var(--trait);
               border-radius:12px; background:#fff; cursor:pointer;
               transition:border-color .13s ease, box-shadow .13s ease; }
.cyc-produit:hover { border-color:#d5d0c4;
                     box-shadow:0 2px 10px rgba(0,0,0,.06); }
.cyc-produit .image { flex:none; width:72px; height:72px; border-radius:9px;
                      overflow:hidden; background:var(--creme);
                      border:1px solid var(--trait); }
.cyc-produit .image img { width:100%; height:100%; object-fit:cover; display:block; }
.cyc-produit .corps { min-width:0; display:flex; flex-direction:column; gap:3px; }
.cyc-produit .nom { font-family:var(--police-titre); font-weight:700;
                    color:var(--titre); line-height:1.25; }
.cyc-produit .detail { color:var(--gris); font-size:.9em; }
.cyc-produit .cyc-badge { align-self:flex-start; }

/* ─── Fiche en surimpression ─────────────────────────────────────────────── */
.cyc-modale { position:fixed; inset:0; z-index:1000; display:flex;
              align-items:center; justify-content:center; padding:20px;
              background:rgba(40,28,16,.5); }
.cyc-modale[hidden] { display:none; }
.cyc-modale-boite { position:relative; width:100%; max-width:560px;
                    background:#fff; border-radius:14px; padding:24px;
                    box-shadow:0 20px 60px rgba(0,0,0,.3);
                    max-height:calc(100vh - 40px); overflow-y:auto; }
.cyc-modale-boite .fermer { position:absolute; top:12px; right:12px; }
.cyc-modale-corps { display:flex; gap:20px; align-items:flex-start; }
.cyc-modale-corps img { flex:none; width:170px; height:170px; object-fit:cover;
                        border-radius:11px; background:var(--creme);
                        border:1px solid var(--trait); }
.cyc-modale-corps .infos { min-width:0; flex:1; padding-right:28px; }
.cyc-modale-corps h3 { font-family:var(--police-titre); font-style:normal;
                       font-weight:700; font-size:1.3em; color:var(--titre);
                       margin:0 0 10px; }
.cyc-modale-corps .prix { font-family:var(--police-titre); font-size:1.5em;
                          font-weight:700; color:var(--titre); margin:0 0 2px; }
.cyc-modale-corps .prix small { font-family:var(--police); font-size:.5em;
                                font-weight:400; color:var(--gris-clair); }
.cyc-modale-corps .producteur { margin-top:14px; padding-top:12px;
                                border-top:1px solid var(--trait); }

@media (max-width:640px) {
  .cyc-modale { padding:12px; }
  .cyc-modale-boite { padding:18px; }
  .cyc-modale-corps { flex-direction:column; gap:14px; }
  .cyc-modale-corps img { width:100%; height:190px; }
  .cyc-modale-corps .infos { padding-right:0; }
}

/* ─── Pastille d'état ─────────────────────────────────────────────────── */
.cyc-etat { display:inline-flex; align-items:center; gap:7px; padding:4px 11px 4px 9px;
            border-radius:999px; background:var(--vert-pale); color:var(--vert-fonce);
            font-size:.83em; font-weight:600; white-space:nowrap; }
.cyc-etat::before { content:""; width:7px; height:7px; border-radius:50%;
                    background:var(--vert); flex:none; }
.cyc-vide { color:#c9c5bc; }

/* ─── Actions ─────────────────────────────────────────────────────────── */
.cyc-actions { display:flex; gap:6px; justify-content:flex-end; align-items:center; }
.cyc-btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px;
           border-radius:6px; border:1px solid var(--trait); background:#fff;
           color:#444; font-size:.9em; font-weight:500; text-decoration:none;
           cursor:pointer; transition:all .13s ease; line-height:1.4; }
.cyc-btn:hover { background:var(--creme); border-color:#d5d0c4; color:#222;
                 text-decoration:none; }
.cyc-btn-primaire { background:var(--vert); border-color:var(--vert); color:#fff;
                    padding:10px 20px; font-size:.95em; font-weight:600; }
.cyc-btn-primaire:hover { background:var(--vert-fonce); border-color:var(--vert-fonce); color:#fff; }
.cyc-btn-danger { color:#b0413e; }
.cyc-btn-danger:hover { background:#fdf1f0; border-color:#e8c4c2; color:#8f302e; }
.cyc-actions form { display:inline; margin:0; }

/* ─── Écrans de liste ─────────────────────────────────────────────────────
   Barre d'outils, filtres, pastilles d'identité, actions en icônes. Communs
   aux écrans de gestion : membres, catalogues, distributions. */

/* Une hauteur unique pour tout ce qui vit sur la barre. Sans elle, chaque
   contrôle prenait la sienne selon son texte et ses marges, et la ligne
   paraissait bancale — la pastille était plus basse que le champ voisin. */
.cyc-barre { --h-controle:38px;
             display:flex; align-items:center; gap:14px; flex-wrap:wrap;
             margin:0 0 18px; }
.cyc-barre .cyc-recherche input,
.cyc-barre .cyc-choix select,
.cyc-barre .cyc-filtre,
.cyc-barre .cyc-btn { box-sizing:border-box; min-height:var(--h-controle); }
/* La pastille rejoint la hauteur des champs : c'est un contrôle de la barre,
   pas une étiquette posée à côté. */
.cyc-barre .cyc-filtre { padding-top:0; padding-bottom:0; padding-left:15px;
                         padding-right:15px; }

/* La recherche d'abord, à gauche : c'est le geste le plus fréquent sur une
   liste de plusieurs centaines de noms. */
.cyc-recherche { position:relative; flex:0 1 320px; margin:0; }
.cyc-recherche input { width:100%; padding:9px 12px 9px 36px; border-radius:999px;
                       border:1px solid #d8d3c8; background:#fff; font-size:.92em;
                       font-family:inherit; color:#333; }
.cyc-recherche input:focus { outline:none; border-color:var(--vert);
                             box-shadow:0 0 0 3px rgba(90,138,0,.13); }
.cyc-recherche > i.icon { position:absolute; left:13px; top:50%;
                          transform:translateY(-50%); color:#b5b0a5;
                          font-size:.95em; pointer-events:none; }

/* Le panneau de gestion : un bloc unique qui porte son titre, ses outils et
   sa liste. Détaché de l'en-tête du site et du fil d'Ariane, il dit ce qui
   relève de l'écran et ce qui relève du site autour. */
.cyc-panneau { background:#fff; border-radius:14px; padding:26px 28px 22px;
               box-shadow:0 1px 2px rgba(0,0,0,.05), 0 1px 12px rgba(0,0,0,.03);
               margin-bottom:22px; }
.cyc-panneau > .cyc-entete { margin-bottom:20px; }
/* Le tableau touche les bords du panneau : encadré dedans, il aurait fait une
   carte dans une carte. */
.cyc-panneau .cyc-deborde { margin:0 -28px; overflow-x:auto; }
.cyc-panneau .cyc-deborde .cyc-table thead th:first-child,
.cyc-panneau .cyc-deborde .cyc-table tbody td:first-child { padding-left:28px; }
.cyc-panneau .cyc-deborde .cyc-table thead th:last-child,
.cyc-panneau .cyc-deborde .cyc-table tbody td:last-child { padding-right:28px; }

/* Le filtre en liste déroulante plutôt qu'en pastilles alignées : sept
   pastilles occupaient une ligne entière pour un choix qu'on fait rarement,
   et l'œil devait les relire à chaque visite pour retrouver laquelle était
   active. Repliée, la liste dit d'un mot où l'on en est. */
.cyc-choix { position:relative; display:inline-flex; }
.cyc-choix select { appearance:none; -webkit-appearance:none;
                    padding:9px 34px 9px 14px; border-radius:999px;
                    border:1px solid #d8d3c8; background:#fff; color:#4a4a4a;
                    font-family:inherit; font-size:.88em; font-weight:500;
                    cursor:pointer; }
.cyc-choix select:focus { outline:none; border-color:var(--vert);
                          box-shadow:0 0 0 3px rgba(90,138,0,.13); }
/* Un filtre actif se voit sans qu'on ait à déplier. */
.cyc-choix.actif select { background:var(--vert-pale); border-color:#b8d18d;
                          color:var(--vert-fonce); font-weight:600; }
.cyc-choix > i.icon { position:absolute; right:13px; top:50%;
                      transform:translateY(-50%); pointer-events:none;
                      color:#b5b0a5; font-size:.8em; }
.cyc-choix.actif > i.icon { color:var(--vert-fonce); }

/* Les filtres en pastilles plutôt qu'en colonne latérale : ils tiennent sur
   une ligne, laissent toute la largeur au tableau, et celui qui est actif se
   voit sans avoir à comparer des liens. */
.cyc-filtres { display:flex; gap:7px; flex-wrap:wrap; margin-left:auto; }
.cyc-filtre { display:inline-flex; align-items:center; gap:6px; padding:6px 13px;
              border-radius:999px; border:1px solid var(--trait); background:#fff;
              color:#5c5850; font-size:.84em; font-weight:500; white-space:nowrap;
              text-decoration:none; transition:all .12s ease; }
.cyc-filtre:hover { background:var(--creme); color:#222; text-decoration:none; }
.cyc-filtre.actif { background:var(--vert-pale); border-color:#b8d18d;
                    color:var(--vert-fonce); font-weight:600; }
.cyc-filtre .compte { font-variant-numeric:tabular-nums; opacity:.65; }
/* Une pastille sans objet : le choix reste lisible mais ne compte plus. */
.cyc-filtre.eteint { opacity:.45; }
.cyc-filtre .badge-alerte { background:#b0413e; color:#fff; border-radius:999px;
                            padding:1px 7px; font-size:.85em; font-weight:700;
                            opacity:1; }

/* Identité : la pastille aux initiales tient lieu de portrait. Elle donne à
   l'œil un point d'accroche par ligne, ce qu'une colonne de noms nus ne fait
   pas — et elle ne coûte aucune requête. */
.cyc-identite { display:flex; align-items:center; gap:12px; }
.cyc-initiales { flex:none; width:36px; height:36px; border-radius:50%;
                 background:var(--creme); border:1px solid var(--trait);
                 display:inline-flex; align-items:center; justify-content:center;
                 font-size:.78em; font-weight:700; color:#7a7468;
                 letter-spacing:.02em; }
.cyc-identite .nom { display:block; font-weight:600; color:var(--titre); }
.cyc-identite .nom:hover { color:var(--vert-fonce); text-decoration:none; }
.cyc-identite .second { display:block; font-size:.85em; color:#8b857a;
                        margin-top:2px; }

/* Actions en icônes seules, révélées au survol de la ligne. Cinq boutons
   nommés par ligne feraient une colonne plus large que le contenu ; le nom
   revient dans l'infobulle et pour les lecteurs d'écran. */
.cyc-icone-btn { display:inline-flex; align-items:center; justify-content:center;
                 width:32px; height:32px; border-radius:7px; border:1px solid transparent;
                 background:none; color:#8b857a; cursor:pointer; font-size:.95em;
                 transition:all .12s ease; text-decoration:none; }
.cyc-icone-btn:hover { background:var(--creme); border-color:var(--trait);
                       color:var(--titre); text-decoration:none; }
/* Le rouge dès le repos : la corbeille avait la couleur des autres icônes et
   ne se distinguait qu'une fois le curseur dessus, c'est-à-dire trop tard pour
   servir d'avertissement. */
.cyc-icone-btn.danger { color:#b0413e; }
.cyc-icone-btn.danger:hover { background:#fdf1f0; border-color:#e8c4c2; color:#8f302e; }
.cyc-table tbody td .cyc-actions { opacity:.45; transition:opacity .12s ease; }
.cyc-table tbody tr:hover .cyc-actions,
.cyc-table tbody tr:focus-within .cyc-actions { opacity:1; }

/* ─── Liste dépliable ─────────────────────────────────────────────────────
   Le même geste que les distributions de l'accueil : une ligne de résumé
   qu'on ouvre pour voir le détail et agir. Les cinq icônes d'avant tenaient
   sur une ligne mais demandaient de deviner ; dépliés, les boutons portent
   leur nom. */
.cyc-liste { border-top:1px solid var(--trait); }
.cyc-bloc { border-bottom:1px solid var(--trait); }
/* Une fiche hors période s'efface sans disparaître : elle reste consultable,
   mais ne se dispute plus l'attention avec celles en cours. */
.cyc-bloc.eteint > .cyc-sommaire { opacity:.58; }
.cyc-bloc.eteint.deplie > .cyc-sommaire { opacity:1; }
.cyc-sommaire { display:flex; align-items:center; gap:14px; width:100%;
                padding:14px 8px; background:none; border:0; text-align:left;
                cursor:pointer; color:inherit; transition:background .12s ease; }
.cyc-sommaire:hover { background:var(--creme); }
.cyc-bloc.deplie > .cyc-sommaire { background:var(--creme); }
.cyc-bloc.deplie .chevron { transform:rotate(180deg); }
.cyc-sommaire .chevron { transition:transform .22s ease; color:#b5b0a5;
                         flex:none; margin-left:4px; }
.cyc-sommaire .ident { flex:1 1 auto; min-width:0; }
.cyc-sommaire .nom { display:block; font-weight:600; color:var(--titre); }
.cyc-sommaire .second { display:block; font-size:.85em; color:#8b857a;
                        margin-top:2px; overflow:hidden; text-overflow:ellipsis;
                        white-space:nowrap; }
.cyc-sommaire .lieu { flex:0 1 auto; min-width:0; color:var(--gris);
                      font-size:.88em; overflow:hidden; text-overflow:ellipsis;
                      white-space:nowrap; }
.cyc-sommaire .cyc-badge { flex:none; }

/* Le détail : des paires intitulé/valeur, sur autant de colonnes que la
   largeur en autorise. */
.cyc-detail { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
              gap:14px 24px; padding:4px 8px 18px; }
.cyc-detail dt { font-size:.78em; font-weight:600; color:#8b857a;
                 margin:0 0 3px; }
.cyc-detail dd { margin:0; color:#3f3d37; }
.cyc-detail dd.muet { color:#b5b0a5; }
/* Les actions, nommées, en pied de panneau. */
.cyc-actions-nommees { display:flex; flex-wrap:wrap; gap:8px;
                       padding:0 8px 16px; align-items:center; }
.cyc-actions-nommees form { margin:0; display:inline-flex; }

@media (max-width:768px) {
  .cyc-sommaire { flex-wrap:wrap; gap:8px 12px; padding:14px 4px; }
  .cyc-sommaire .lieu { flex:1 1 100%; }
  .cyc-actions-nommees .cyc-btn { flex:1 1 auto; justify-content:center; }
}

/* En-tête de fiche : qui, en grand, et ses actions à portée. */
.cyc-fiche-tete { display:flex; align-items:center; gap:18px; flex-wrap:wrap;
                  margin-bottom:22px; }
.cyc-fiche-tete .ident { flex:1 1 240px; min-width:0; }
.cyc-fiche-tete h3 { font-family:var(--police-titre); font-style:normal;
                     font-size:1.5em; font-weight:700; color:var(--titre);
                     margin:0 0 4px; }
.cyc-initiales.grande { width:58px; height:58px; font-size:1.05em; }
.cyc-actions-nommees.serrees { padding:0; }

/* Le détail bordé : quand il n'est pas dans un panneau replié mais posé sous
   un en-tête, il lui faut un filet pour s'en détacher. */
.cyc-detail.bordee { border-top:1px solid var(--trait); padding:18px 0 0;
                     margin:0; }

/* Le pied d'un tableau porte un total : il se lit comme une conclusion, pas
   comme une ligne de plus. */
.cyc-table tfoot td { padding:14px; border-top:2px solid var(--trait);
                      font-weight:700; color:var(--titre); }
.cyc-table tfoot .total-intitule { text-align:right; font-weight:600;
                                   color:var(--gris); }

/* La zone dangereuse, à part et en bas : le seul geste qu'on ne peut pas
   défaire ne doit pas voisiner ceux qu'on fait tous les jours. */
/* La liste des producteurs qui ne suivent pas la fenêtre du jour. */
.cyc-ecarts { list-style:none; margin:10px 0 0; padding:0; }
.cyc-ecarts li { display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px;
                 padding:6px 0; border-top:1px solid #ecd9d7; font-size:.93em; }
.cyc-ecarts li:first-child { border-top:0; }
.cyc-ecarts .nom { font-weight:700; }
.cyc-ecarts .fenetre { color:#8b6e6c; }

.cyc-zone-danger { border:1px solid #e8c4c2; }
.cyc-zone-danger h3 { color:#8f302e; }
.cyc-zone-danger form { margin:0; }

/* ─── Onglets ─────────────────────────────────────────────────────────────
   À l'horizontale, sous le titre. En colonne latérale, cinq entrées prenaient
   un quart de la largeur et la reprenaient aux tableaux, qui en ont l'usage.
   Le filet du bas relie l'onglet actif au contenu qu'il ouvre. */
.cyc-onglets { display:flex; gap:4px; flex-wrap:wrap;
               border-bottom:1px solid var(--trait); margin:0 0 22px; }
.cyc-onglets a { display:inline-flex; align-items:center; gap:7px;
                 padding:10px 15px; margin-bottom:-1px;
                 border-bottom:2px solid transparent; color:#7a7468;
                 font-size:.92em; font-weight:500; text-decoration:none;
                 white-space:nowrap; transition:all .12s ease; }
.cyc-onglets a:hover { color:var(--titre); text-decoration:none; }
.cyc-onglets a i.icon { color:#b5b0a5; }
.cyc-onglets a.actif { color:var(--vert-fonce); font-weight:700;
                       border-bottom-color:var(--vert); }
.cyc-onglets a.actif i.icon { color:var(--vert-fonce); }
.cyc-onglet-contenu > :first-child { margin-top:0; }
/* Un onglet qui mène à un écran sans garde-fou se distingue des autres. */
.cyc-onglets a.danger { color:#a8524f; }
.cyc-onglets a.danger i.icon { color:#c08a88; }
.cyc-onglets a.danger:hover { color:#8f302e; }
.cyc-onglets a.danger.actif { color:#8f302e; border-bottom-color:#b0413e; }
.cyc-onglets a.danger.actif i.icon { color:#8f302e; }

/* Pastille de date, à la manière d'un feuillet de calendrier. Elle donne à
   chaque ligne son point d'ancrage : sur un écran de planning, c'est la date
   qu'on cherche d'abord. */
/* Assez large pour porter un mois entier : « Septembre » ne doit ni se couper
   ni passer à la ligne. L'interlettrage des capitales, qui gagne en lisibilité
   sur deux ou trois lettres, coûte ici la place d'un caractère — il est
   réduit d'autant. */
.cyc-date { flex:none; width:82px; border-radius:9px; overflow:hidden;
            border:1px solid var(--trait); background:#fff; text-align:center;
            line-height:1.1; }
.cyc-date .jour { display:block; font-size:.66em; font-weight:700;
                  text-transform:uppercase; letter-spacing:.03em;
                  background:var(--creme); color:#8b857a; padding:4px 3px;
                  white-space:nowrap; }
.cyc-date .numero { display:block; font-family:var(--police-titre);
                    font-size:1.75em; font-weight:700; color:var(--titre);
                    padding-top:5px; }
.cyc-date .mois { display:block; font-size:.66em; font-weight:600;
                  text-transform:uppercase; letter-spacing:.02em;
                  color:#8b857a; padding:0 3px 6px; white-space:nowrap; }
.cyc-date.aujourdhui { border-color:#b8d18d; }
.cyc-date.aujourdhui .jour { background:var(--vert); color:#fff; }
.cyc-date.aujourdhui .numero { color:var(--vert-fonce); }

/* Navigation de période : deux flèches et un libellé, groupés pour se lire
   comme un seul contrôle. */
.cyc-periode { display:inline-flex; align-items:center; border-radius:999px;
               border:1px solid var(--trait); background:#fff; overflow:hidden; }
.cyc-periode a { display:inline-flex; align-items:center; justify-content:center;
                 width:36px; height:36px; color:#8b857a; text-decoration:none;
                 transition:all .12s ease; }
.cyc-periode a:hover { background:var(--creme); color:var(--titre);
                       text-decoration:none; }
.cyc-periode .libelle { padding:0 14px; font-size:.86em; font-weight:600;
                        color:var(--titre); white-space:nowrap; }

/* Le solde, en grand et avant le détail : c'est le chiffre qu'on vient
   chercher. La couleur dit le sens — dû par, dû à — sans qu'on ait à
   interpréter un signe moins. */
.cyc-solde { display:flex; flex-direction:column; gap:2px; padding:18px 20px;
             border-radius:11px; background:var(--creme);
             border:1px solid var(--trait); margin:0 0 20px; }
.cyc-solde .intitule { font-size:.78em; font-weight:600; color:#8b857a; }
.cyc-solde .montant { font-family:var(--police-titre); font-size:2em;
                      font-weight:700; line-height:1.15; color:var(--titre); }
.cyc-solde.debiteur { background:#fdf3e6; border-color:#e8d2ae; }
.cyc-solde.debiteur .montant { color:#8a5a1c; }
.cyc-solde.crediteur .montant { color:var(--vert-fonce); }
.cyc-solde .cyc-note { margin:2px 0 0; }
.cyc-table td.negatif { color:#8f302e; }

/* Une ligne désactivée s'efface sans disparaître : on doit pouvoir la
   retrouver pour la réactiver. */
.cyc-table tbody tr.eteinte { opacity:.5; transition:opacity .12s ease; }
/* Une ligne éteinte reste lisible dès qu'on la vise : à demi effacée, ses
   actions en icônes ne se distinguaient plus les unes des autres. */
.cyc-table tbody tr.eteinte:hover,
.cyc-table tbody tr.eteinte:focus-within { opacity:1; }
.cyc-table tbody tr.eteinte:hover { opacity:1; }
/* Une référence est une suite de caractères qu'on recopie : chasse fixe. */
.cyc-ref { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.85em;
           color:#8b857a; background:none; padding:0; }
/* Un bouton dans une pastille de filtre : même forme, comportement de bouton. */
.cyc-filtre { font-family:inherit; cursor:pointer; }

/* Le logo du groupe sur sa fiche, et l'aperçu carré du choix d'image. */
.cyc-logo-groupe { flex:none; width:76px; height:76px; object-fit:cover;
                   border-radius:12px; border:1px solid var(--trait); }
.cyc-apercu-carre { width:200px; height:200px; margin:0 auto 18px;
                    background:var(--creme); border:1px solid var(--trait);
                    border-radius:12px; display:flex; align-items:center;
                    justify-content:center; overflow:hidden; color:#c9c5bc;
                    font-size:2.4em; }
.cyc-apercu-carre img { width:100%; height:100%; object-fit:cover; }

/* Une adresse qu'on recopie : chasse fixe, et de quoi la sélectionner d'un
   trait sans attraper le texte autour. */
.cyc-adresse { display:flex; align-items:center; gap:9px; padding:12px 15px;
               background:var(--creme); border:1px solid var(--trait);
               border-radius:9px; word-break:break-all; }
.cyc-adresse a { color:var(--vert-fonce); }

/* Une liste de droits : des pastilles côte à côte plutôt qu'une liste à
   puces, qui étirait la ligne sur autant de niveaux que de délégations. */
.cyc-droits { display:flex; flex-wrap:wrap; gap:5px; }

/* Vignette de produit dans un tableau. */
.cyc-vignette { width:44px; height:44px; object-fit:cover; border-radius:7px;
                border:1px solid var(--trait); display:block; }
.cyc-vignette.muette { opacity:.45; }

.cyc-vignette.ronde { border-radius:50%; width:38px; height:38px; }

/* Une bande de vignettes de produits, sous le catalogue qui les propose. */
.cyc-vignettes { display:grid; gap:10px;
                 grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
                 margin:12px 0 4px; }
.cyc-vignettes figure { margin:0; }
.cyc-vignettes img { width:100%; aspect-ratio:1; object-fit:cover;
                     border-radius:9px; border:1px solid var(--trait);
                     display:block; background:var(--creme); }
.cyc-vignettes figcaption { font-size:.78em; color:var(--gris); margin-top:5px;
                            line-height:1.35; }

/* Le compte des destinataires, sous la liste qui le détermine : c'est la
   conséquence immédiate du choix qu'on vient de faire. Zéro se signale en
   couleur, avant l'envoi plutôt qu'après. */
.cyc-destinataires { margin-top:14px; padding:14px 16px; border-radius:10px;
                     background:var(--vert-pale); border:1px solid #cfe0a8; }
.cyc-destinataires .tete { display:flex; align-items:center; gap:10px;
                           flex-wrap:wrap; }
.cyc-destinataires .nombre { font-family:var(--police-titre); font-size:1.6em;
                             font-weight:700; color:var(--vert-fonce);
                             line-height:1; }
.cyc-destinataires .mot { color:var(--vert-fonce); font-weight:600; }
.cyc-destinataires .tete .cyc-btn { margin-left:auto; }
.cyc-destinataires .liste { list-style:none; margin:12px 0 0; padding:12px 0 0;
                            border-top:1px solid #cfe0a8; max-height:280px;
                            overflow-y:auto; font-size:.86em; color:#4a4a4a;
                            columns:2; column-gap:24px; }
.cyc-destinataires .liste li { padding:2px 0; break-inside:avoid;
                               word-break:break-all; }
.cyc-destinataires.vide { background:#fdf1f0; border-color:#e8c4c2; }
.cyc-destinataires.vide .nombre,
.cyc-destinataires.vide .mot { color:#8f302e; }
.cyc-contact .nom.alerte { color:#8f302e; }
.cyc-contact .nom small { font-weight:400; color:var(--gris); }

@media (max-width:768px) {
  .cyc-destinataires .liste { columns:1; }
}

/* Le contact du groupe, dans l'en-tête : quelques lignes serrées plutôt qu'une
   colonne latérale pour trois informations. */
.cyc-contact { flex:none; max-width:260px; text-align:right; font-size:.88em;
               line-height:1.6; color:var(--gris); }
.cyc-contact .intitule { display:block; font-size:.86em; font-weight:600;
                         color:#8b857a; }
.cyc-contact .nom { display:block; font-weight:700; color:var(--titre); }
.cyc-contact a, .cyc-contact span { display:block; }

/* Aperçu d'une image en cours de remplacement. */
.cyc-apercu { margin:0 0 18px; }
.cyc-apercu img { max-width:220px; max-height:220px; object-fit:cover;
                  border-radius:10px; border:1px solid var(--trait);
                  display:block; }

/* Un exemple de fichier : du texte à recopier, pas de la prose. */
.cyc-exemple { background:var(--creme); border:1px solid var(--trait);
               border-radius:8px; padding:12px 14px; margin:0 0 16px;
               font-size:.84em; line-height:1.6; overflow-x:auto;
               color:#4a4a4a; }

/* Un message de réussite, pendant du bloc d'alerte. */
.cyc-succes { background:var(--vert-pale); border:1px solid #cfe0a8;
              border-radius:9px; padding:13px 16px; margin:0 0 18px;
              color:var(--vert-fonce); }

/* Une ligne de liste qui mène ailleurs plutôt que de se déplier. */
/* Une ligne de liste qui ne se déplie pas : même mise en page, sans le
   comportement de bouton. */
.cyc-sommaire.statique { cursor:default; }
.cyc-sommaire.statique:hover { background:none; }
.cyc-sommaire .cyc-actions { flex:none; }
.cyc-sommaire.lien { text-decoration:none; }
.cyc-sommaire.lien:hover { text-decoration:none; }
.cyc-sommaire.lien .chevron { transform:none; }

/* Un message rapporté : encadré et sur fond crème pour qu'on voie où commence
   la parole de quelqu'un d'autre. */
.cyc-message { background:var(--creme); border:1px solid var(--trait);
               border-radius:9px; padding:14px 16px; margin:0 8px 16px; }
.cyc-message .intitule { font-size:.78em; font-weight:600; color:#8b857a;
                         margin-bottom:6px; }
.cyc-message p { margin:0; color:#3f3d37; line-height:1.6; }

/* Un badge d'état, pour ce qui se lit d'un coup d'œil et ne se clique pas. */
.cyc-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px;
             border-radius:999px; font-size:.78em; font-weight:600;
             white-space:nowrap; background:#f0ece2; color:#6b665c; }
.cyc-badge.ok { background:var(--vert-pale); color:var(--vert-fonce); }
.cyc-badge.attention { background:#fdf3e6; color:#8a5a1c; }

/* Pagination : des crans, pas une liste à puces. */
.cyc-pages { display:flex; gap:5px; justify-content:center; align-items:center;
             flex-wrap:wrap; margin:18px 0 0; }
.cyc-pages a { display:inline-flex; align-items:center; justify-content:center;
               min-width:34px; height:34px; padding:0 9px; border-radius:7px;
               border:1px solid var(--trait); background:#fff; color:#5c5850;
               font-size:.88em; text-decoration:none; transition:all .12s ease; }
.cyc-pages a:hover { background:var(--creme); color:#222; text-decoration:none; }
.cyc-pages a.actif { background:var(--vert); border-color:var(--vert); color:#fff;
                     font-weight:600; }
.cyc-pages .ellipse { color:#b5b0a5; padding:0 2px; }

@media (max-width:768px) {
  .cyc-panneau { padding:18px 16px 16px; border-radius:12px; }
  .cyc-panneau .cyc-deborde { margin:0 -16px; }
  .cyc-panneau .cyc-deborde .cyc-table thead th:first-child,
  .cyc-panneau .cyc-deborde .cyc-table tbody td:first-child { padding-left:16px; }
  .cyc-panneau .cyc-deborde .cyc-table thead th:last-child,
  .cyc-panneau .cyc-deborde .cyc-table tbody td:last-child { padding-right:16px; }
  .cyc-choix, .cyc-choix select { width:100%; }
  .cyc-filtres { margin-left:0; }
  .cyc-onglets { gap:0; overflow-x:auto; flex-wrap:nowrap; }
  .cyc-onglets a { padding:10px 12px; font-size:.88em; }
  .cyc-barre { gap:10px; }
  .cyc-recherche { flex:1 1 100%; }
  .cyc-icone-btn { width:38px; height:38px; }
  .cyc-table tbody td .cyc-actions { opacity:1; }
}

/* ─── Formulaire ──────────────────────────────────────────────────────── */
.cyc-section { margin:0 0 26px; }
.cyc-section > h4 { font-family:var(--police-titre); font-style:normal;
                    font-size:1.12em; font-weight:700; color:var(--titre);
                    margin:0 0 5px; }
.cyc-section > .cyc-aide { color:var(--titre-doux); font-size:.92em;
                           margin:0 0 14px; line-height:1.55; }
/* « auto-fill » et non « auto-fit » : avec auto-fit, les colonnes vides sont
   supprimées et le dernier champ d'une ligne s'étire sur toute la largeur.
   D'un bloc à l'autre, les champs n'avaient plus la même taille et rien ne
   s'alignait verticalement. auto-fill garde la grille, donc les colonnes. */
.cyc-champs { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
              gap:16px 20px; align-items:start; }
.cyc-champ { display:flex; flex-direction:column; }
.cyc-champ.large { grid-column:1/-1; }
.cyc-champ label { font-weight:600; color:#4a4a4a; font-size:.9em; margin-bottom:5px; }
/* On nomme les exceptions plutôt que les cas. Énumérer les types à dessiner
   — text, date, time, number, file — laissait dehors ceux auxquels on n'avait
   pas pensé : « email », « password », « tel » et « search » retombaient sur
   le dessin par défaut du navigateur, carrés et gris au milieu de champs
   arrondis. Les cases à cocher et les boutons, eux, sont une liste finie. */
.cyc-champ input:not([type=checkbox]):not([type=radio]):not([type=submit]):not([type=button]):not([type=hidden]):not([type=range]):not([type=color]),
.cyc-champ select, .cyc-champ textarea {
  width:100%; padding:9px 12px; border:1px solid #d8d3c8; border-radius:6px;
  font-family:inherit; font-size:.95em; color:#333; background:#fff;
  transition:border-color .13s ease, box-shadow .13s ease; }
.cyc-champ textarea { line-height:1.6; resize:vertical; min-height:150px; }
/* Un champ qu'on ne peut pas modifier le dit de lui-même : dessiné comme les
   autres, il invitait à cliquer dedans pour rien. */
.cyc-champ input[readonly], .cyc-champ textarea[readonly] {
  background:var(--creme); color:var(--gris); cursor:default; }
.cyc-champ input[readonly]:focus { border-color:#d8d3c8; box-shadow:none; }
.cyc-champ input:focus, .cyc-champ select:focus, .cyc-champ textarea:focus {
  outline:none; border-color:var(--vert); box-shadow:0 0 0 3px rgba(90,138,0,.13); }
.cyc-note { color:var(--gris-clair); font-size:.84em; margin:5px 0 0; line-height:1.45; }

/* Rythme : des pastilles cliquables plutôt qu'une pile de boutons radio. */
.cyc-rythmes { display:flex; flex-wrap:wrap; gap:8px; }
.cyc-rythmes input { position:absolute; opacity:0; pointer-events:none; }
.cyc-rythmes label { display:block; padding:9px 15px; border:1px solid #d8d3c8;
                     border-radius:999px; cursor:pointer; font-size:.9em;
                     font-weight:500; color:#555; background:#fff; margin:0;
                     transition:all .13s ease; }
.cyc-rythmes label:hover { border-color:var(--vert); color:var(--vert-fonce); }
.cyc-rythmes input:checked + label { background:var(--vert); border-color:var(--vert);
                                     color:#fff; font-weight:600; }
.cyc-rythmes input:focus-visible + label { box-shadow:0 0 0 3px rgba(90,138,0,.25); }

/* Ligne composée : « de 19:00 à 20:00 », « 10 jours avant, à 08:00 ». */
/* Deux valeurs dans un même champ — « de … à … », « n jours avant, à … ».
   Sur une seule ligne, elles ne tiennent pas dans une colonne de grille : les
   champs d'heure prennent plus de 130px de large sur certains navigateurs, et
   la ligne se repliait où elle pouvait.
   D'où une grille de deux colonnes : les mots à gauche sur une largeur fixe,
   le champ à droite. Fixe et non « auto » — sinon « jours avant » élargit sa
   colonne et les trois blocs ne s'alignent plus entre eux. */
.cyc-duo { display:grid; grid-template-columns:6.4em 1fr; gap:8px 10px;
           align-items:center; }
.cyc-duo .mot { text-align:right; color:#8b857a; font-size:.88em;
                white-space:nowrap; }
.cyc-duo > input { width:100%; }

/* Ancienne mise en ligne, encore employée ailleurs dans le formulaire. */
.cyc-ligne { display:flex; align-items:center; gap:7px; flex-wrap:wrap;
             color:#555; font-size:.9em; }
.cyc-ligne > input { flex:none; width:84px; min-width:0; }

/* ─── Interrupteur du rappel ──────────────────────────────────────────── */
.cyc-bascule { display:flex; gap:13px; align-items:flex-start; padding:16px 18px;
               background:var(--creme); border:1px solid var(--trait);
               border-radius:10px; cursor:pointer; transition:all .15s ease; }
.cyc-bascule:hover { border-color:#d5d0c4; }
.cyc-bascule.actif { background:var(--vert-pale); border-color:#cfe0a8; }
.cyc-bascule input { width:18px; height:18px; margin:2px 0 0; flex:none; cursor:pointer;
                     accent-color:var(--vert); }
.cyc-bascule .titre { font-family:var(--police-titre); font-weight:700;
                      color:var(--titre); display:block; margin-bottom:4px;
                      font-size:1.02em; }
.cyc-bascule .cyc-note { margin:0; }

/* Dépliage : la hauteur s'anime, le contenu ne saute pas. */
.cyc-repli { display:grid; grid-template-rows:0fr; opacity:0;
             transition:grid-template-rows .28s ease, opacity .2s ease, margin .28s ease;
             margin-top:0; }
.cyc-repli > div { overflow:hidden; }
.cyc-repli.ouvert { grid-template-rows:1fr; opacity:1; margin-top:20px; }

/* ─── Pied de formulaire ──────────────────────────────────────────────── */
.cyc-pied { display:flex; gap:10px; align-items:center; margin-top:26px;
            padding-top:20px; border-top:1px solid var(--trait); }
.cyc-pied .cyc-espace { flex:1; }

/* ─── Panneau latéral ─────────────────────────────────────────────────── */
.cyc-fiche dl { margin:0; }
.cyc-fiche dt { font-size:.74em; font-weight:700; letter-spacing:.08em;
                text-transform:uppercase; color:var(--gris-clair); margin:0 0 3px; }
.cyc-fiche dd { margin:0 0 15px; color:#3a3a3a; font-size:.98em; }
.cyc-fiche dd:last-of-type { margin-bottom:0; }

/* ─── Zone dangereuse ─────────────────────────────────────────────────── */
.cyc-danger { margin-top:18px; padding:18px 20px; border:1px solid #ecd9d7;
              border-radius:10px; background:#fdf7f6; }
.cyc-danger h4 { font-family:var(--police-titre); font-style:normal;
                 font-weight:700; margin:0 0 6px; font-size:1.02em; color:#8f302e; }

/* ─── Vide ────────────────────────────────────────────────────────────── */
/* Le déclencheur du défilement continu a besoin d'une hauteur : un bloc vide
   mesure zéro, et un élément sans surface n'est jamais signalé comme entrant
   dans la fenêtre. */
#mbr-sentinelle { height:24px; }
.cyc-chargement { text-align:center; color:var(--gris-clair); font-size:.88em;
                  padding:14px; }

.cyc-aucun { text-align:center; padding:46px 20px; color:var(--gris); }
.cyc-aucun .icone { font-size:2.6em; color:#dcd8cd; display:block; margin-bottom:12px; }
.cyc-aucun p { margin:0 0 18px; }

@media (max-width:768px) {
  .cyc-carte { padding:18px 16px; border-radius:10px; }
  .cyc-entete { margin-bottom:18px; }
  .cyc-entete h3 { font-size:1.45em; }

  /* Le tableau se replie en fiches : à 375 px, sept colonnes obligeraient à
     pousser la page latéralement pour lire la dernière. */
  .cyc-table thead { display:none; }
  .cyc-table tbody td { display:block; border:0; padding:3px 0; }
  .cyc-table tbody tr { display:block; padding:16px 0; border-bottom:1px solid var(--trait); }
  .cyc-table td.num { text-align:left; }
  .cyc-chiffre { font-size:1em; }
  .cyc-chiffre small { display:inline; font-size:.85em; margin-left:4px; }

  /* Cibles tactiles : 44 px de haut au moins. Un bouton de 33 px se vise mal
     au doigt, et se manque d'autant plus qu'il est destructeur. */
  .cyc-btn { min-height:44px; padding:11px 16px; }
  .cyc-btn-primaire { width:100%; justify-content:center; }
  .cyc-actions { justify-content:flex-start; margin-top:14px; gap:8px; }
  .cyc-actions .cyc-btn { flex:1; justify-content:center; }

  /* 16 px au moins dans les champs : en dessous, iOS zoome à chaque mise au
     point et le formulaire part de travers. */
