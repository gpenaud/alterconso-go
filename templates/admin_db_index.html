{{define "content"}}
{{template "admin_db_nav" .}}

<p class="cyc-aide">
  Choisissez une table pour consulter ou corriger ses enregistrements.
</p>

<div class="ac-tuiles">
  {{range .Tables}}
  <div class="ac-tuile">
    <a href="/admin/db/{{.Slug}}" class="ac-tuile-lien">
      <span class="ac-tuile-titre">{{.Label}}</span>
      <span class="ac-tuile-desc"><code class="cyc-ref">{{.Slug}}</code></span>
    </a>
  </div>
  {{end}}
</div>

{{template "admin_db_close" .}}
{{end}}
